
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoodVision AI | Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;
font-family:Segoe UI,Arial,sans-serif;color:#f5f7ff;
background:radial-gradient(circle at 15% 20%,#1c5267,transparent 36%),
radial-gradient(circle at 90% 90%,#51316d,transparent 35%),#080d1b}
.panel{width:min(440px,100%);padding:38px;border:1px solid #ffffff20;
border-radius:24px;background:#111b2ded;box-shadow:0 25px 80px #0007}
.logo{font-size:48px}h1{color:#6af0d1;margin:8px 0}
p{color:#aabbd2;line-height:1.6}
label{display:block;margin:18px 0 8px;font-size:14px}
input{width:100%;padding:14px;border-radius:11px;border:1px solid #35445f;
background:#091323;color:white;font-size:15px}
button{width:100%;padding:14px;margin-top:24px;border:0;border-radius:11px;
background:linear-gradient(90deg,#6af0d1,#7cbaff);font-weight:800;
font-size:15px;cursor:pointer;color:#07111e}
.error{background:#512632;padding:12px;border-radius:10px;color:#ffd6de}
.hint{font-size:12px;color:#91a3bd;margin-top:20px}
</style>
</head>
<body>
<main class="panel">
<div class="logo">🍱</div>
<h1>FoodVision AI</h1>
<p>Smart food recognition powered by computer vision.</p>

{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="error">{{ message }}</div>
{% endfor %}
{% endwith %}

<form method="POST" action="{{ url_for('login') }}">
<label for="username">Username</label>
<input id="username" name="username" autocomplete="username" required>

<label for="password">Password</label>
<input id="password" name="password" type="password"
autocomplete="current-password" required>

<button type="submit">Sign in →</button>
</form>

<p class="hint">Local demo login: admin / foodvision123</p>
</main>
</body>
</html>
